<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log In</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="BigBox" id="BigBox">
            <h1 id="Welcome">Welcome</h1>
            <h2 id="Credentials">Please enter your credentials</h2>
            <div class="Email" id="Email">
                <input required type="text" name="Email" placeholder="Email" id="EmailBox">

            </div>
            <div class="Password" id="Password">
                <input required  type="text" name="Password" placeholder="Password" id="PasswordBox" min="3" max="20">
            </div>
            <div class="ButtonBox" id="ButtonBox">
                <form>
                    <button type="submit" id="Button">Log in</button>
                </form>
            </div>
        </div>
    </body>
</html>
